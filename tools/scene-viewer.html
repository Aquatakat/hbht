<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scene viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Views the glTF scenes that `aidyn scenes <rom>` writes to out/<version>/scenes. Serve the repo
  root on localhost (see .claude/launch.json) and open
  /tools/scene-viewer.html?v=na10&scene=1940 (add &anim=<borg6> to start an animation). If
  `aidyn actors <rom>` has been run, scenes that actors use get an actor panel. The files are
  ROM-derived: keep them local.
-->
<style>
  :root { --bg: #20222a; --fg: #e8e8ec; --muted: #9a9cab; --panel: #2c2f3a; --accent: #7fb0ff; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px system-ui, sans-serif; overflow: hidden; }
  #bar { position: fixed; top: 0; left: 0; right: 0; display: flex; gap: 8px; align-items: center; padding: 8px 12px;
         background: var(--panel); flex-wrap: wrap; z-index: 1; }
  #bar input[type=number] { width: 6em; }
  #info, #clock { color: var(--muted); }
  #anims, #actorBar { display: none; gap: 8px; align-items: center; }
  #time { width: 16em; }
  #clock { font-variant-numeric: tabular-nums; }
  #states { position: fixed; right: 0; bottom: 0; width: 26em; overflow-y: auto; background: rgba(44, 47, 58, 0.92);
            padding: 8px 12px; box-sizing: border-box; display: none; font-size: 13px; }
  #states div { padding: 4px 6px; border-radius: 4px; cursor: pointer; }
  #states div:hover { background: rgba(255, 255, 255, 0.06); }
  #states div.current { outline: 1px solid var(--accent); }
  #states .branches { color: var(--muted); display: block; }
  #states .interrupts { color: var(--accent); }
  canvas { display: block; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="bar">
  <label>Scene <input id="scene" type="number" min="0"></label>
  <button id="prev">◀</button><button id="next">▶</button>
  <label><input id="useCamera" type="checkbox"> Scene camera (4:3)</label>
  <label><input id="wire" type="checkbox"> Wireframe</label>
  <span id="anims">
    <select id="anim"></select>
    <button id="play">❚❚</button>
    <input id="time" type="range" min="0" step="1">
    <span id="clock"></span>
    <label title="Actors are drawn with transform 2 at the origin; the game moves them by its motion instead"><input id="inPlace" type="checkbox"> Root in place</label>
  </span>
  <span id="actorBar">
    <select id="actor"></select>
    <label title="Run the actor's state machine, answering this request">
      <input id="drive" type="checkbox"> Drive <select id="request"></select></label>
    <button id="home" title="Put the actor back at the origin">⟲</button>
  </span>
  <span id="info"></span>
</div>
<div id="states"></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const params = new URLSearchParams(location.search);
const version = params.get('v') ?? 'na10';
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);
const orbit = new THREE.PerspectiveCamera(45, 1, 0.001, 10000);
const controls = new OrbitControls(orbit, renderer.domElement);
const loader = new GLTFLoader();
let root = null, sceneCamera = null, mixer = null, clips = [], action = null, actorRoot = null, playing = true;
const clock = new THREE.Clock();
const world = new THREE.Scene();
world.background = new THREE.Color(0x20222a);

const $ = id => document.getElementById(id);
$('useCamera').checked = params.get('camera') === '1';

// Request meanings from the decomp's AniTypes; the others are shown as numbers.
const requestNames = { 0: 'idle', 2: 'walk', 3: 'run', 7: 'hit', 9: 'dying', 25: 'sneak' };
const requestName = r => r === 'any' ? 'any' : requestNames[r] ? `${r} ${requestNames[r]}` : `${r}`;
const allActors = fetch(`../out/${version}/actors/actors.json`).then(r => r.ok ? r.json() : null).catch(() => null);

// Animations are baked at one sample per 60 Hz tick; tick 0 of the clip is the game's time 1.
function showAnimations(gltf) {
  clips = gltf.animations;
  mixer = clips.length ? new THREE.AnimationMixer(gltf.scene) : null;
  action = null;
  const still = gltf.scene.userData?.stillAnimations ?? [];
  $('anims').style.display = clips.length ? 'flex' : 'none';
  $('anim').replaceChildren(...clips.map((c, i) => new Option(`${c.name} (${Math.round(c.duration * 60)} ticks)`, i)));
  actorRoot = null;
  gltf.scene.traverse(o => { if (o.userData?.transform === 2 && !o.userData.billboard) actorRoot = o; });
  const wanted = clips.findIndex(c => c.name === `borg6 ${params.get('anim')}`);
  if (clips.length) playClip(wanted >= 0 ? wanted : 0);
  return still.length ? `; ${still.length} still (${still.map(a => a.borg6).join(', ')})` : '';
}

function playClip(i) {
  action?.stop();
  $('anim').value = i;
  action = mixer.clipAction(clips[i]);
  action.play();
  action.paused = !playing || drive.on;
  $('time').max = Math.round(clips[i].duration * 60);
  highlightState();
  updateUrl();
}

// The transform's position field: its translation plus its pivot, scaled and rotated.
function rootPosition() {
  const p = actorRoot.userData.pivot ?? [0, 0, 0];
  return new THREE.Vector3(...p).multiply(actorRoot.scale).applyQuaternion(actorRoot.quaternion).add(actorRoot.position);
}

function holdRoot() {
  if (!(drive.on || $('inPlace').checked) || !actorRoot) return;
  // With its position zeroed, a pivot-rotate transform's translation is −(pivot × scale) rotated.
  const p = actorRoot.userData.pivot ?? [0, 0, 0];
  actorRoot.position.set(...p).multiply(actorRoot.scale).applyQuaternion(actorRoot.quaternion).negate();
}

// Actors (Borg7): a state per animation, and branches taken by request (see Borg7Actor.cs).
let actors = [], actor = null;
const drive = { on: false, state: 0, clock: 1, fraction: 0, request: 0, lastRequest: 0, skip: 0, prev: null, motion: new THREE.Vector3() };

async function showActors(index) {
  actors = ((await allActors)?.actors ?? []).filter(a => a.scene === index);
  $('actorBar').style.display = actors.length ? 'flex' : 'none';
  $('states').style.display = actors.length ? 'block' : 'none';
  $('actor').replaceChildren(...actors.map((a, i) => new Option(
    `Borg7 ${a.borg7}${a.usedBy.length ? ': ' + a.usedBy.map(u => u.name).join(', ') : ''}`, i)));
  $('drive').checked = drive.on = false;
  selectActor(0);
}

function selectActor(i) {
  actor = actors[i] ?? null;
  if (!actor) return;
  const requests = new Set([0]);
  actor.states.forEach(s => s.branches.forEach(b => { if (b.request !== 'any') requests.add(b.request); }));
  $('request').replaceChildren(...[...requests].sort((a, b) => a - b).map(r => new Option(requestName(r), r)));
  $('states').replaceChildren(...actor.states.map((s, n) => {
    const div = document.createElement('div');
    div.dataset.borg6 = s.borg6;
    div.innerHTML = `<b>${n}</b> · borg6 ${s.borg6} · ${s.length} ticks${s.initial ? ' · initial' : ''}` +
      `<span class="branches">${s.branches.map(b => `<span class="${b.interrupts ? 'interrupts' : ''}">` +
        `${requestName(b.request)}${b.chance < 100 ? ` ${b.chance}%` : ''} → ${b.state}</span>`).join(', ')}</span>`;
    div.onclick = () => drive.on ? enterState(n) : playClip(clipFor(s.borg6));
    return div;
  }));
  home();
  highlightState();
}

function highlightState() {
  const borg6 = action?.getClip().name.replace('borg6 ', '');
  [...$('states').children].forEach((d, n) =>
    d.classList.toggle('current', drive.on ? n === drive.state : d.dataset.borg6 === borg6));
}

const clipFor = borg6 => clips.findIndex(c => c.name === `borg6 ${borg6}`);

function enterState(n) {
  drive.state = n; drive.clock = 1; drive.fraction = 0;
  // The game doesn't move the actor on the tick a branch is taken, or the two after.
  drive.skip = 3;
  playClip(clipFor(actor.states[n].borg6));
  action.time = 0;
}

// The game rolls 0–99 and walks the branches in order, subtracting each match's chance.
function roll(matches) {
  let r = Math.floor(Math.random() * 100);
  for (const b of actor.states[drive.state].branches)
    if (matches(b) && (r -= b.chance) < 1) return b;
  return null;
}

function tickActor() {
  const state = actor.states[drive.state];
  const changed = drive.request !== drive.lastRequest;
  drive.lastRequest = drive.request;
  if (drive.clock >= state.length) {
    const b = roll(b => b.request === drive.request || b.request === 'any');
    enterState(b ? b.state : drive.state);
    return;
  }
  // A new request can cut the animation short through a branch that interrupts. Either way,
  // the game doesn't advance the animation on the tick the request changes.
  if (changed) {
    const b = roll(b => b.request === drive.request && b.interrupts);
    if (b) enterState(b.state);
    return;
  }
  drive.clock++;
}

function home() {
  drive.motion.set(0, 0, 0); drive.prev = null;
  if (root) root.position.set(0, 0, 0);
}

function updateUrl() {
  const anim = action ? `&anim=${clips[+$('anim').value].name.replace('borg6 ', '')}` : '';
  history.replaceState(null, '', `?v=${version}&scene=${$('scene').value}${anim}${$('useCamera').checked ? '&camera=1' : ''}`);
}

function resize() {
  const top = $('bar').offsetHeight;
  let w = innerWidth, h = innerHeight - top;
  if ($('useCamera').checked) { if (w / h > 4 / 3) w = Math.round(h * 4 / 3); else h = Math.round(w * 3 / 4); }
  renderer.setSize(w, h);
  renderer.domElement.style.marginTop = top + 'px';
  $('states').style.top = top + 'px';
  orbit.aspect = w / h; orbit.updateProjectionMatrix();
  if (sceneCamera) { sceneCamera.aspect = 4 / 3; sceneCamera.updateProjectionMatrix(); }
}

async function load(index) {
  $('scene').value = index;
  const url = `../out/${version}/scenes/${String(index).padStart(5, '0')}.glb`;
  let gltf;
  try { gltf = await loader.loadAsync(url); }
  catch { $('info').textContent = `No scene at ${url}`; return; }
  if (root) world.remove(root);
  root = gltf.scene;
  world.add(root);
  world.children.filter(c => c.isAmbientLight).forEach(c => world.remove(c));
  const extras = gltf.scene.userData ?? {};
  const ambient = extras.ambientLight ?? [0.6, 0.6, 0.6];
  world.add(new THREE.AmbientLight(new THREE.Color(...ambient), Math.PI));
  let lights = 0;
  root.traverse(o => {
    if (o.isLight) { lights++; o.intensity *= Math.PI; }
    if (o.isMesh) o.material.wireframe = $('wire').checked;
  });
  if (!lights) { const d = new THREE.DirectionalLight(0xffffff, 1.5); d.position.set(1, 2, 3); root.add(d); }
  sceneCamera = gltf.cameras[0] ?? null;
  drive.on = false;
  const stillText = showAnimations(gltf);
  await showActors(index);
  updateUrl();

  const box = new THREE.Box3();
  root.traverse(o => { if (o.isMesh) box.expandByObject(o); });
  const size = box.getSize(new THREE.Vector3()), centre = box.getCenter(new THREE.Vector3());
  const r = Math.max(size.length() / 2, 1e-3);
  orbit.near = r / 100; orbit.far = r * 100; orbit.updateProjectionMatrix();
  orbit.position.copy(centre).add(new THREE.Vector3(1, 0.6, 1.4).normalize().multiplyScalar(r * 2.6));
  controls.target.copy(centre); controls.update();
  const meshes = []; root.traverse(o => { if (o.isMesh) meshes.push(o); });
  $('info').textContent = `Borg5 ${index}: ${meshes.length} meshes, ${size.x.toFixed(2)} × ${size.y.toFixed(2)} × ${size.z.toFixed(2)} scene units, ${clips.length} animations${stillText}`;
  resize();
}

$('scene').addEventListener('change', e => load(+e.target.value));
$('prev').onclick = () => load(+$('scene').value - 1);
$('next').onclick = () => load(+$('scene').value + 1);
$('useCamera').onchange = () => load(+$('scene').value);
$('wire').onchange = () => root?.traverse(o => { if (o.isMesh) o.material.wireframe = $('wire').checked; });
$('anim').onchange = e => playClip(+e.target.value);
$('play').onclick = () => { playing = !playing; if (action && !drive.on) action.paused = !playing; $('play').textContent = playing ? '❚❚' : '▶'; };
$('time').oninput = e => {
  if (!action || drive.on) return;
  playing = false; action.paused = true; $('play').textContent = '▶';
  action.time = +e.target.value / 60; mixer.update(0);
};
$('actor').onchange = e => { $('drive').checked = drive.on = false; selectActor(+e.target.value); };
$('drive').onchange = e => {
  drive.on = e.target.checked;
  drive.request = drive.lastRequest = +$('request').value;
  home();
  if (drive.on) enterState(0); else playClip(+$('anim').value);
};
$('request').onchange = e => { drive.request = +e.target.value; };
$('home').onclick = home;
addEventListener('keydown', e => {
  if (!action || drive.on || e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
  if (e.key === ' ') { e.preventDefault(); $('play').click(); }
  if (e.key === ',' || e.key === '.') {
    playing = false; action.paused = true; $('play').textContent = '▶';
    const ticks = Math.round(action.time * 60) + (e.key === '.' ? 1 : -1);
    action.time = Math.max(0, Math.min(+$('time').max, ticks)) / 60; mixer.update(0);
  }
});
addEventListener('resize', resize);
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  if (mixer && drive.on && actor) {
    drive.fraction += playing ? dt * 60 : 0;
    for (; drive.fraction >= 1; drive.fraction--) {
      tickActor();
      // Move the actor by how far the root's position moved this tick.
      action.time = (drive.clock - 1) / 60; mixer.update(0);
      const p = rootPosition();
      if (drive.skip > 0) drive.skip--;
      else if (drive.prev) drive.motion.add(new THREE.Vector3(p.x - drive.prev.x, 0, p.z - drive.prev.z));
      drive.prev = p;
    }
    action.time = Math.min(drive.clock - 1 + drive.fraction, actor.states[drive.state].length - 1) / 60;
    mixer.update(0);
    root.position.copy(drive.motion);
    holdRoot();
    $('time').value = drive.clock - 1;
    $('clock').textContent = `state ${drive.state}, time ${drive.clock} / ${actor.states[drive.state].length}`;
  } else if (mixer) {
    mixer.update(playing ? dt : 0);
    holdRoot();
    const tick = Math.round(action.time * 60);
    $('time').value = tick;
    $('clock').textContent = `time ${tick + 1} / ${$('time').max}`;
  }
  renderer.render(world, $('useCamera').checked && sceneCamera ? sceneCamera : orbit);
});
load(+(params.get('scene') ?? 1940));
</script>
</body>
</html>
