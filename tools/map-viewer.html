<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Map viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Views a whole map set: its chunks' scenes, the scenery its map objects place, its collision and
  its map objects by type. Needs `aidyn maps <rom>` (out/<version>/maps) and `aidyn scenes <rom>`
  (out/<version>/scenes). Serve the repo root on localhost (see .claude/launch.json) and open
  /tools/map-viewer.html?v=na10&set=Overworld (add &chunk=H10 to start at a chunk). The files are
  ROM-derived: keep them local.
-->
<style>
  :root { --bg: #20222a; --fg: #e8e8ec; --muted: #9a9cab; --panel: #2c2f3a; --accent: #7fb0ff; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px system-ui, sans-serif; overflow: hidden; }
  #bar { position: fixed; top: 0; left: 0; right: 0; display: flex; gap: 10px; align-items: center; padding: 8px 12px;
         background: var(--panel); flex-wrap: wrap; z-index: 1; }
  #info, #hover { color: var(--muted); }
  #legend { position: fixed; left: 0; bottom: 0; padding: 8px 12px; background: rgba(44, 47, 58, 0.92); font-size: 13px;
            display: flex; flex-wrap: wrap; gap: 4px 12px; max-width: 60em; }
  #legend label { white-space: nowrap; cursor: pointer; }
  #legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin: 0 4px 0 2px; }
  #panel { position: fixed; right: 0; bottom: 0; width: 28em; overflow-y: auto; background: rgba(44, 47, 58, 0.94);
           padding: 8px 12px; box-sizing: border-box; display: none; font-size: 13px; }
  #panel pre { white-space: pre-wrap; word-break: break-word; margin: 6px 0; font-size: 12px; }
  #panel a { color: var(--accent); cursor: pointer; }
  canvas { display: block; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="bar">
  <select id="set"></select>
  <label><input id="terrain" type="checkbox" checked> Terrain</label>
  <label><input id="scenery" type="checkbox" checked> Scenery</label>
  <label>Collision <select id="collision">
    <option value="off">off</option><option value="surface">by surface</option><option value="role">by role</option>
  </select></label>
  <label><input id="markers" type="checkbox" checked> Objects</label>
  <label title="Objects and triangles that exist only with, or only without, the Expansion Pak">
    <input id="pak" type="checkbox" checked> Expansion Pak</label>
  <label><input id="grid" type="checkbox"> Chunk grid</label>
  <span id="info"></span>
  <span id="hover"></span>
</div>
<div id="legend"></div>
<div id="panel"></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const params = new URLSearchParams(location.search);
const version = params.get('v') ?? 'na10';
const $ = id => document.getElementById(id);
const sets = ['Overworld', 'GoblinCamp', 'PortSaiid', 'Lighthouse', 'GwerniaCastle', 'GwerniaInteriors', 'MiscInteriors',
  'Erromon', 'Terminor', 'Barrows', 'RoogCave', 'JundarInteriors', 'EhudUnder', 'Ugarit', 'Ugarit2', 'ChaosIsle', 'Battlefields'];
$('set').replaceChildren(...sets.map(s => new Option(s, s)));

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 20000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.screenSpacePanning = true;
const world = new THREE.Scene();
world.background = new THREE.Color(0x20222a);
world.add(new THREE.AmbientLight(0xffffff, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(0.4, 1, 0.3);
world.add(sun);
const loader = new GLTFLoader();

// Map object types, as VoxelType names them, with a colour each.
const types = {
  Scene: '#8d99ae', Container: '#f4c542', Light: '#fff4a8', Audio: '#6ec6ff', WanderNode: '#9be38b',
  MonsterParty: '#ff5c5c', ReferencePoint: '#c792ea', Teleporter: '#00e5c0', Camera: '#ff9f43', Dialogue: '#ff7ad9',
  Trigger: '#7f8cff', SavePoint: '#ffffff', Code: '#555a66',
};
// Scenes are drawn as scenery. Reference points are mostly cut-scene staging, and crowd the view.
const hiddenTypes = new Set(['Scene', 'Code', 'ReferencePoint']);
// CollisionSurface, in order, and TriangleRole as the export numbers it.
const surfaces = ['Default', 'Player and camera', 'Player', 'Snow', 'Grass', 'Sand', 'Mucky', 'Sizzle', 'Cave', 'Wood',
  'Wood echo', 'Stone', 'Stone echo', 'Stone huge echo', 'Water', 'Trans snow', 'Trans grass', 'Trans sand',
  'Trans mucky', 'Trans sizzle', 'Trans cave', 'Trans wood', 'Trans wood echo', 'Trans stone', 'Trans stone echo',
  'Trans stone huge echo'];
const surfaceColours = ['#777777', '#b0b0b8', '#ff4d4d', '#ffffff', '#5cb85c', '#e8d18a', '#7a5c3a', '#ff8c1a', '#6b6b8f',
  '#b07a45', '#8f5a2e', '#9aa4ad', '#76828c', '#56606a', '#3d8bff'];
const surfaceColour = s => surfaceColours[s] ?? new THREE.Color().setHSL((s * 0.13) % 1, 0.7, 0.6).getStyle();
const roles = ['Normal', 'Toggle', 'Trigger', 'Expansion Pak only'];
const roleColours = ['#6f7480', '#ff9f43', '#ff4dd2', '#ffe14d'];

let map = null, group = null, pickables = [], selected = null, sceneCache = new Map();

function objectShown(o) {
  const flags = o.flags.split(', ');
  if ($('pak').checked ? flags.includes('NoExpansionPak') : flags.includes('ExpansionPak')) return false;
  return true;
}

const progress = { asked: 0, loaded: 0 };
async function scene(index) {
  if (!sceneCache.has(index)) {
    progress.asked++;
    sceneCache.set(index, loader.loadAsync(`../out/${version}/scenes/${String(index).padStart(5, '0')}.glb`)
      .then(g => g.scene).catch(() => null)
      .finally(() => { progress.loaded++; $('info').textContent = `Loading scenes: ${progress.loaded} of ${progress.asked}`; }));
  }
  return sceneCache.get(index);
}

async function load(set) {
  $('set').value = set;
  $('info').textContent = `Loading ${set}…`;
  let collision;
  try {
    [map, collision] = await Promise.all([
      fetch(`../out/${version}/maps/${set}.json`).then(r => { if (!r.ok) throw r; return r.json(); }),
      loader.loadAsync(`../out/${version}/maps/${set}.glb`)]);
  } catch {
    $('info').textContent = `No map at out/${version}/maps/${set}.json: run aidyn maps first.`;
    return;
  }
  if (group) world.remove(group);
  group = new THREE.Group();
  world.add(group);
  select(null);

  group.add(await terrain());
  group.add(collisionLayer(collision.scene));
  group.add(chunkGrid());
  await rebuild();
  frame(params.get('chunk'));
  updateUrl();
}

// Each chunk's scene, and its see-through second scene, at the chunk's origin.
async function terrain() {
  const layer = new THREE.Group();
  layer.name = 'terrain';
  await Promise.all(map.chunks.flatMap(c => [c.scene, c.altScene].filter(s => s).map(async s => {
    const root = await scene(s);
    if (!root) return;
    const copy = root.clone();
    copy.position.fromArray(c.origin);
    layer.add(copy);
  })));
  return layer;
}

function collisionLayer(root) {
  root.name = 'collision';
  root.traverse(o => {
    if (!o.isMesh) return;
    o.geometry.computeVertexNormals();
    o.geometry.setAttribute('color', new THREE.Float32BufferAttribute(new Float32Array(o.geometry.attributes.position.count * 3), 3));
    o.material = new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true, side: THREE.DoubleSide,
      transparent: true, opacity: 0.75, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 });
  });
  return root;
}

function colourCollision() {
  const mode = $('collision').value;
  const root = group?.getObjectByName('collision');
  if (!root) return;
  root.visible = mode !== 'off';
  const colour = new THREE.Color();
  root.traverse(o => {
    if (!o.isMesh) return;
    const { _surface: surface, _role: role, color } = o.geometry.attributes;
    for (let i = 0; i < color.count; i++) {
      const r = role.getX(i);
      colour.set(mode === 'role' ? roleColours[r] : surfaceColour(surface.getX(i)));
      // Without the pak, the game makes those triangles passable.
      if (r === 3 && !$('pak').checked) colour.multiplyScalar(0.2);
      color.setXYZ(i, colour.r, colour.g, colour.b);
    }
    color.needsUpdate = true;
  });
  legend();
}

function chunkGrid() {
  const size = map.cellSize, points = [];
  for (const c of map.chunks) {
    const [x, , z] = c.origin;
    points.push(x, 0, z, x + size, 0, z, x + size, 0, z, x + size, 0, z + size,
      x + size, 0, z + size, x, 0, z + size, x, 0, z + size, x, 0, z);
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(points, 3));
  const lines = new THREE.LineSegments(geometry, new THREE.LineBasicMaterial({ color: 0x7fb0ff, transparent: true, opacity: 0.5 }));
  lines.name = 'grid';
  return lines;
}

// Scenery and markers depend on the Expansion Pak setting and the type filter, so they're rebuilt.
async function rebuild() {
  for (const name of ['scenery', 'markers']) {
    const old = group.getObjectByName(name);
    if (old) group.remove(old);
  }
  group.add(await scenery());
  group.add(markers());
  applyVisibility();
  colourCollision();
}

// Scene objects share a few models, so each model's meshes become instanced meshes.
async function scenery() {
  const layer = new THREE.Group();
  layer.name = 'scenery';
  const byModel = new Map();
  for (const c of map.chunks)
    for (const o of c.objects)
      if (o.draw !== undefined && objectShown(o)) {
        const m = new THREE.Matrix4().compose(
          new THREE.Vector3(...o.position).add(new THREE.Vector3(...c.origin)),
          new THREE.Quaternion(...o.orientation), new THREE.Vector3(...o.scale));
        if (!byModel.has(o.draw)) byModel.set(o.draw, []);
        byModel.get(o.draw).push(m);
      }
  await Promise.all([...byModel].map(async ([index, matrices]) => {
    const root = await scene(index);
    if (!root) return;
    root.updateMatrixWorld(true);
    root.traverse(mesh => {
      if (!mesh.isMesh) return;
      const instanced = new THREE.InstancedMesh(mesh.geometry, mesh.material, matrices.length);
      matrices.forEach((m, i) => instanced.setMatrixAt(i, new THREE.Matrix4().multiplyMatrices(m, mesh.matrixWorld)));
      instanced.computeBoundingSphere();
      layer.add(instanced);
    });
  }));
  return layer;
}

// Markers are dots of a fixed size on screen, so they show at any zoom.
const dot = (() => {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = 32;
  const g = canvas.getContext('2d');
  g.fillStyle = '#fff'; g.strokeStyle = '#000'; g.lineWidth = 4;
  g.beginPath(); g.arc(16, 16, 13, 0, Math.PI * 2); g.fill(); g.stroke();
  return new THREE.CanvasTexture(canvas);
})();
const dotPixels = 10;
function markers() {
  const layer = new THREE.Group();
  layer.name = 'markers';
  pickables = [];
  for (const [type, colour] of Object.entries(types)) {
    const list = map.chunks.flatMap(c => c.objects.filter(o => o.type === type && objectShown(o)).map(o => ({ c, o })));
    if (!list.length || hiddenTypes.has(type)) continue;
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(
      list.flatMap(({ c, o }) => o.position.map((v, k) => v + c.origin[k])), 3));
    const points = new THREE.Points(geometry, new THREE.PointsMaterial({ color: colour, size: dotPixels * devicePixelRatio,
      sizeAttenuation: false, map: dot, alphaTest: 0.5 }));
    points.renderOrder = 2;
    points.userData.objects = list;
    layer.add(points);
    pickables.push(points);
  }
  return layer;
}

function applyVisibility() {
  if (!group) return;
  for (const [name, box] of [['terrain', 'terrain'], ['scenery', 'scenery'], ['markers', 'markers'], ['grid', 'grid']]) {
    const o = group.getObjectByName(name);
    if (o) o.visible = $(box).checked;
  }
  const c = group.getObjectByName('collision');
  if (c) c.visible = $('collision').value !== 'off';
}

function legend() {
  const counts = {};
  for (const c of map.chunks) for (const o of c.objects) if (objectShown(o)) counts[o.type] = (counts[o.type] ?? 0) + 1;
  const chips = Object.entries(types).filter(([t]) => counts[t]).map(([t, colour]) => {
    const label = document.createElement('label');
    label.innerHTML = `<input type="checkbox" ${hiddenTypes.has(t) ? '' : 'checked'}><i style="background:${colour}"></i>${t} ${counts[t]}`;
    label.firstChild.onchange = e => { e.target.checked ? hiddenTypes.delete(t) : hiddenTypes.add(t); rebuild(); };
    return label;
  });
  const mode = $('collision').value;
  if (mode !== 'off') {
    const seen = new Set();
    group.getObjectByName('collision').traverse(o => {
      if (!o.isMesh) return;
      const a = mode === 'role' ? o.geometry.attributes._role : o.geometry.attributes._surface;
      for (let i = 0; i < a.count; i += 3) seen.add(a.getX(i));
    });
    for (const v of [...seen].sort((a, b) => a - b)) {
      const span = document.createElement('label');
      span.innerHTML = `<i style="background:${mode === 'role' ? roleColours[v] : surfaceColour(v)}"></i>${mode === 'role' ? roles[v] : surfaces[v]}`;
      chips.push(span);
    }
  }
  $('legend').replaceChildren(...chips);
  const triangles = map.chunks.reduce((n, c) => n + c.triangles, 0);
  $('info').textContent = `${map.set}: ${map.chunks.length} chunks, cells ${map.cellSize} apart, ` +
    `${triangles.toLocaleString()} triangles, ${Object.values(counts).reduce((a, b) => a + b, 0).toLocaleString()} objects`;
}

function frame(chunkName) {
  const chunk = map.chunks.find(c => c.name === chunkName);
  // Frame the chunks' cells rather than their collision: one chunk has a stray box far away.
  const box = new THREE.Box3();
  for (const c of chunk ? [chunk] : map.chunks) {
    const [x, , z] = c.origin, y = c.grid.origin[1];
    box.expandByPoint(new THREE.Vector3(x, y, z));
    box.expandByPoint(new THREE.Vector3(x + map.cellSize, y, z + map.cellSize));
  }
  const centre = box.getCenter(new THREE.Vector3()), r = Math.max(box.getSize(new THREE.Vector3()).length() / 2, 5);
  controls.target.copy(centre);
  camera.position.copy(centre).add(new THREE.Vector3(0.3, 1, 0.8).normalize().multiplyScalar(r * 1.6));
  camera.near = r / 500; camera.far = r * 50; camera.updateProjectionMatrix();
  controls.update();
}

// Clicking a marker shows its object; hovering shows the chunk and collision under the cursor.
const raycaster = new THREE.Raycaster(), pointer = new THREE.Vector2();
function cast(event, objects) {
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.set((event.clientX - rect.left) / rect.width * 2 - 1, -(event.clientY - rect.top) / rect.height * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  return raycaster.intersectObjects(objects, true);
}
let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => downAt = [e.clientX, e.clientY]);
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 4 || !$('markers').checked) return;
  // Points are hit within a world distance, so turn the dot's radius into one at the target's depth.
  const perPixel = 2 * camera.position.distanceTo(controls.target) * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) /
    renderer.domElement.clientHeight;
  raycaster.params.Points.threshold = perPixel * dotPixels * 0.6;
  const hit = cast(e, pickables)[0];
  select(hit ? hit.object.userData.objects[hit.index] : null);
});
let hoverPending = false;
renderer.domElement.addEventListener('pointermove', e => {
  if (hoverPending || !group) return;
  hoverPending = true;
  requestAnimationFrame(() => {
    hoverPending = false;
    const root = group.getObjectByName('collision');
    const hit = root ? cast(e, [root])[0] : null;
    if (!hit) { $('hover').textContent = ''; return; }
    const i = hit.face.a, a = hit.object.geometry.attributes;
    const chunk = hit.object.parent?.userData?.chunk ?? hit.object.userData?.chunk ?? '';
    const p = hit.point;
    $('hover').textContent = `${chunk} · ${surfaces[a._surface.getX(i)]} · ${roles[a._role.getX(i)]} · ` +
      `(${p.x.toFixed(1)}, ${p.y.toFixed(1)}, ${p.z.toFixed(1)})`;
  });
});

let radiusMesh = null;
function select(item) {
  selected = item;
  if (radiusMesh) { world.remove(radiusMesh); radiusMesh = null; }
  if (!item) { $('panel').style.display = 'none'; return; }
  const { c, o } = item;
  const centre = new THREE.Vector3(...o.position).add(new THREE.Vector3(...c.origin));
  if (o.radius > 0) {
    radiusMesh = new THREE.Mesh(new THREE.SphereGeometry(o.radius, 24, 12),
      new THREE.MeshBasicMaterial({ color: types[o.type], wireframe: true, transparent: true, opacity: 0.35 }));
    radiusMesh.position.copy(centre);
    world.add(radiusMesh);
  }
  // Arrays of plain values go on one line, and entity IDs get their names.
  const named = JSON.stringify(o.data ?? {}, null, 1)
    .replace(/\[\s+([^\[\]{}]*?)\s+\]/g, (s, inner) => `[${inner.replace(/\s+/g, ' ')}]`)
    .replace(/"(0x[0-9A-F]{4})"/g, (s, id) => map.names[id] ? `${s} (${map.names[id]})` : s);
  const links = o.links.map(l => `<a data-link="${l}">${l} ${c.objects[l]?.type ?? ''}</a>`).join(', ');
  $('panel').innerHTML = `<b style="color:${types[o.type]}">${o.type}</b> ${o.index} in ${c.name} (Borg9 ${c.borg9})` +
    `<br>at (${o.position.map(v => v.toFixed(2)).join(', ')}), radius ${o.radius}` +
    `<br>there: ${o.visible} · works: ${o.enabled} · flags A ${o.flagA}, B ${o.flagB}, C ${o.flagC}` +
    `<br>${o.flags}${links ? `<br>links: ${links}` : ''}<pre>${named}</pre>`;
  $('panel').querySelectorAll('a[data-link]').forEach(a => a.onclick = () => select({ c, o: c.objects[+a.dataset.link] }));
  $('panel').style.display = 'block';
}

function updateUrl() {
  history.replaceState(null, '', `?v=${version}&set=${$('set').value}`);
}
function resize() {
  const top = $('bar').offsetHeight;
  renderer.setSize(innerWidth, innerHeight - top);
  renderer.domElement.style.marginTop = top + 'px';
  $('panel').style.top = top + 'px';
  camera.aspect = innerWidth / (innerHeight - top);
  camera.updateProjectionMatrix();
}

$('set').onchange = e => { params.delete('chunk'); load(e.target.value); };
for (const id of ['terrain', 'scenery', 'markers', 'grid']) $(id).onchange = applyVisibility;
$('collision').onchange = () => { applyVisibility(); colourCollision(); };
$('pak').onchange = () => rebuild();
addEventListener('resize', resize);
resize();
renderer.setAnimationLoop(() => { controls.update(); renderer.render(world, camera); });
$('collision').value = params.get('collision') ?? 'off';
load(sets.includes(params.get('set')) ? params.get('set') : 'Overworld');
</script>
</body>
</html>
