<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quest atlas</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Browses the quest atlas that `aidyn atlas <rom>` writes to out/<version>/atlas/atlas.json.
  Serve the repo root on localhost (the scene-viewer entry in .claude/launch.json) and open
  /tools/quest-atlas.html?v=na10. The atlas is ROM-derived: keep it local.

  Links: #flag/47, #script/866 (optionally /node), #object/12. The graph shows what leads to the
  selected item (upstream) and what it leads to (downstream).
-->
<style>
  :root { --bg: #20222a; --fg: #e8e8ec; --muted: #9a9cab; --panel: #2c2f3a; --line: #3b3f4d;
          --flag: #e0b04a; --script: #6fa8ff; --object: #7ccf8a; --derived: #c58af0; --engine: #9a9cab; --warn: #ff8a7a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, sans-serif; height: 100vh;
         display: grid; grid-template-rows: auto 1fr; }
  #bar { display: flex; gap: 10px; align-items: center; padding: 8px 12px; background: var(--panel); flex-wrap: wrap; }
  #bar input[type=search] { width: min(28em, 100%); padding: 4px 8px; }
  #bar .muted { color: var(--muted); }
  main { display: grid; grid-template-columns: minmax(320px, 44%) 1fr; min-height: 0; }
  #side { overflow: auto; padding: 12px 16px; border-right: 1px solid var(--line); }
  #graph { min-height: 0; }
  a { color: inherit; text-decoration: underline dotted; cursor: pointer; }
  h2 { margin: 0 0 4px; font-size: 18px; }
  h3 { margin: 16px 0 4px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  ul { margin: 0; padding-left: 18px; }
  li { margin: 2px 0; }
  .tag { display: inline-block; padding: 0 6px; border-radius: 3px; font-size: 12px; background: var(--line); margin-right: 4px; }
  .flag { color: var(--flag); } .script { color: var(--script); } .object { color: var(--object); }
  .derived { color: var(--derived); } .engine { color: var(--engine); } .ignored { color: var(--warn); }
  .muted { color: var(--muted); }
  .quote { color: #d8d2c0; font-style: italic; }
  .node { border-left: 3px solid var(--line); padding: 2px 8px; margin: 6px 0; }
  .node.hl { border-left-color: var(--flag); background: #3a3524; }
  .node .ops { font-family: ui-monospace, monospace; font-size: 12px; color: var(--muted); }
  .journal { background: #2a2f25; border-left: 3px solid var(--object); padding: 4px 8px; margin: 6px 0; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; grid-template-rows: 55% 45%; }
    #side { border-right: 0; border-bottom: 1px solid var(--line); } }
</style>
<script src="https://cdn.jsdelivr.net/npm/cytoscape@3.30.2/dist/cytoscape.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dagre@0.8.5/dist/dagre.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cytoscape-dagre@2.5.0/cytoscape-dagre.min.js"></script>
</head>
<body>
<div id="bar">
  <input id="q" type="search" placeholder="Flag number, script 866, or words from dialogue, journal, names">
  <label>Graph <select id="dir"><option value="up">upstream</option><option value="down">downstream</option><option value="both">both</option></select></label>
  <label>Depth <select id="depth"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></label>
  <label title="Hide the calendar, weather, terrain and party-stat inputs"><input id="hideEngine" type="checkbox" checked> Hide engine flags</label>
  <span id="info" class="muted"></span>
</div>
<main><div id="side"></div><div id="graph"></div></main>
<script>
const params = new URLSearchParams(location.search);
const version = params.get('v') ?? 'na10';
const $ = id => document.getElementById(id);
let A, cy;
const idx = { refsByFlag: new Map(), refsBySrc: new Map(), engineFlags: new Set() };

const srcKey = s => s.script !== undefined ? `s:${s.script}` : s.object !== undefined ? `o:${s.object}`
  : s.derived !== undefined ? `f:${s.derived}` : s.shop !== undefined ? `p:${s.shop}` : `e:${s.engine}`;
const push = (m, k, v) => { if (!m.has(k)) m.set(k, []); m.get(k).push(v); };
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const name = id => A.names[id] ?? id;
const hex4 = n => '0x' + n.toString(16).toUpperCase().padStart(4, '0');
// The game drops a leading V and four digits from each line, and puts the player's name in place of 20 #s.
const plain = t => (t ?? '').replace(/^\s*[vV]\d{4}\s*/, '').replace(/#{20}/g, '[player]');
const text = t => esc(plain(t)).replace(/\\n/g, '<br>');

async function init() {
  try { A = await (await fetch(`../out/${version}/atlas/atlas.json`)).json(); }
  catch { $('side').innerHTML = `<p>No atlas at <code>out/${version}/atlas/atlas.json</code>. Run <code>aidyn atlas &lt;rom&gt;</code>.</p>`; return; }
  for (const r of A.refs) { push(idx.refsByFlag, r.flag, r); push(idx.refsBySrc, srcKey(r.src), r); }
  for (const e of A.engine) for (let f = e.first; f <= e.last; f++) idx.engineFlags.add(f);
  $('info').textContent = `${A.version}: ${A.refs.length} references, ${Object.keys(A.scripts).length} scripts, ${A.objects.length} map objects`;
  cy = cytoscape({ container: $('graph'), wheelSensitivity: 0.3, maxZoom: 1.6, style: [
    { selector: 'node', style: { label: 'data(label)', color: '#e8e8ec', 'font-size': 10, 'text-wrap': 'wrap', 'text-max-width': 140,
      'text-valign': 'bottom', 'text-margin-y': 4, width: 16, height: 16, 'background-color': 'data(color)' } },
    { selector: 'node[shape]', style: { shape: 'data(shape)' } },
    { selector: 'node.focus', style: { 'border-width': 3, 'border-color': '#fff', width: 22, height: 22 } },
    { selector: 'edge', style: { width: 1.2, 'line-color': '#5a5f70', 'target-arrow-color': '#5a5f70', 'target-arrow-shape': 'triangle',
      'curve-style': 'bezier', label: 'data(label)', 'font-size': 8, color: '#9a9cab', 'text-rotation': 'autorotate' } },
    { selector: 'edge.clear', style: { 'line-style': 'dashed', 'line-color': '#ff8a7a', 'target-arrow-color': '#ff8a7a' } },
  ] });
  new ResizeObserver(() => { cy.resize(); cy.fit(undefined, 30); }).observe($('graph'));
  cy.on('tap', 'node', e => { location.hash = e.target.id().replace(/^s:/, 'script/').replace(/^o:/, 'object/').replace(/^f:/, 'flag/'); });
  $('q').addEventListener('keydown', e => { if (e.key === 'Enter') search($('q').value.trim()); });
  for (const id of ['dir', 'depth', 'hideEngine']) $(id).addEventListener('change', route);
  addEventListener('hashchange', route);
  route();
}

function route() {
  const [kind, a, b] = location.hash.slice(1).split('/');
  if (kind === 'flag') showFlag(+a);
  else if (kind === 'script') showScript(+a, b === undefined ? null : +b);
  else if (kind === 'object') showObject(+a);
  else if (kind === 'search') search(decodeURIComponent(a ?? ''), false);
  else $('side').innerHTML = help();
}

function help() {
  const j = A.journal.slice(0, 12).map((e, i) => `<li><a href="#flag/${e.flag}">${esc(e.text.slice(0, 90))}…</a></li>`).join('');
  return `<h2>Quest atlas</h2><p class="muted">Search for a flag number, <code>script 866</code>, or words. Start from a journal entry:</p><ul>${j}</ul>`;
}

// ---- Labels and links ------------------------------------------------------------------------

function flagLabel(f) {
  const j = A.journal.findIndex(e => e.flag === f);
  if (j >= 0) return `Journal ${j}`;
  if (f >= A.bitFlagCount && f - 5556 >= 0 && f - 5556 < A.journal.length) return `Journal ${f - 5556} trigger`;
  if (A.labels?.[f]) return A.labels[f];
  const e = A.engine.find(e => f >= e.first && f <= e.last);
  return e ? e.description : f >= A.bitFlagCount ? 'derived' : '';
}
const flagLink = f => `<a class="${f >= A.bitFlagCount ? 'derived' : 'flag'}" href="#flag/${f}">flag ${f}</a>`;
function objectTitle(i) {
  const o = A.objects[i];
  const what = o.name ? ` “${esc(o.name)}”` : o.entity ? ` ${esc(name(o.entity))}` : '';
  return `${o.type}${what} in ${o.chunks.length ? o.chunks.join(' / ') : 'Borg9 ' + o.borg9}`;
}
const objectLink = i => `<a class="object" href="#object/${i}">${objectTitle(i)}</a>`;
function scriptTitle(n) {
  const s = A.scripts[n];
  const first = plain(s.nodes.find(x => x.text)?.text);
  return `Borg13 ${n} (${s.mode})${first ? ' “' + esc(first.slice(0, 50)) + (first.length > 50 ? '…' : '') + '”' : ''}`;
}
const scriptLink = (n, node) => `<a class="script" href="#script/${n}${node !== undefined ? '/' + node : ''}">${scriptTitle(n)}${node !== undefined ? ', node ' + node : ''}</a>`;
function srcLink(s) {
  if (s.script !== undefined) return scriptLink(s.script, s.node);
  if (s.object !== undefined) return objectLink(s.object);
  if (s.derived !== undefined) return `<a class="derived" href="#flag/${s.derived}">derived flag ${s.derived}</a> <span class="muted">${esc(flagLabel(s.derived))}</span>`;
  if (s.shop !== undefined) return `<span class="object">shop ${s.shop}, run by ${esc(name(s.shopkeeper))}</span>`;
  return `<span class="engine">engine: ${esc(s.engine)}</span>`;
}
function derivation(f) {
  const d = A.flags[f]; if (!d) return '';
  const cmp = { Equal: '==', Greater: '>', Less: '<', NotEqual: '!=' }[d.op];
  const ins = d.inputs.map(flagLink).join(', ');
  if (d.kind === 'Logic') return d.op === 'Mask' ? `inputs as bits == ${d.operand} of [${ins}]` : `${d.op.toUpperCase()} of [${ins}]`;
  return d.kind === 'Count' ? `number set ${cmp} ${d.operand} of [${ins}]` : `inputs as bits ${cmp} ${d.operand} of [${ins}]`;
}
function refItem(r, other) {
  const how = `<span class="tag">${r.role}${r.access === 'Clear' ? ' (clears)' : ''}</span>`;
  return `<li class="${r.ignored ? 'ignored' : ''}">${how}${other}${r.ignored ? ' <span class="ignored">(the game ignores this write)</span>' : ''}</li>`;
}

// ---- Panels ----------------------------------------------------------------------------------

function showFlag(f) {
  const refs = idx.refsByFlag.get(f) ?? [];
  const d = A.flags[f];
  let h = `<h2 class="${f >= A.bitFlagCount ? 'derived' : 'flag'}">Flag ${f}</h2><div class="muted">${f >= A.bitFlagCount ? 'Derived: ' + derivation(f) : 'Plain flag' + (d?.initial ? ', starts set' : '')}</div>`;
  A.journal.forEach((e, i) => { if (e.flag === f) h += `<div class="journal"><b>Journal ${i}</b><br>${text(e.text)}</div>`; });
  const lbl = flagLabel(f); if (lbl && !lbl.startsWith('Journal ') && lbl !== 'derived') h += `<p class="engine">${esc(lbl)}</p>`;
  const set = refs.filter(r => r.access !== 'Read'), read = refs.filter(r => r.access === 'Read');
  const none = f >= A.bitFlagCount ? 'Computed from its inputs.' : 'Nothing in the data or the engine code the atlas knows of.';
  h += `<h3>Set or cleared by</h3>${set.length ? '<ul>' + set.map(r => refItem(r, srcLink(r.src))).join('') + '</ul>' : `<p class="muted">${none}</p>`}`;
  h += `<h3>Read by</h3>${read.length ? '<ul>' + read.map(r => refItem(r, srcLink(r.src))).join('') + '</ul>' : '<p class="muted">Nothing in the data.</p>'}`;
  $('side').innerHTML = h; $('side').scrollTop = 0;
  graph(`f:${f}`);
}

function showScript(n, focus) {
  const s = A.scripts[n];
  if (!s) { $('side').innerHTML = `<p>No script ${n}.</p>`; return; }
  let h = `<h2 class="script">Borg13 ${n}</h2><div class="muted">${s.mode}, tool id ${s.id}${s.mode === 'Conversation' || s.mode === 'Sign' ? '' : ', sets ' + flagLink(s.doneFlag) + ' when done'}${s.backdrop !== undefined ? ', backdrop ' + s.backdrop : ''}</div>`;
  if (s.actors.length) h += `<p>Actors: ${s.actors.map(a => esc(name(a))).join(', ')}</p>`;
  h += `<h3>Started by</h3>${s.startedBy.length ? '<ul>' + s.startedBy.map(x => `<li>${srcLink(x.src)}</li>`).join('') + '</ul>' : '<p class="muted">No map object or script. Engine code, or unused.</p>'}`;
  h += `<h3>Nodes</h3>`;
  s.nodes.forEach((node, i) => {
    const ops = node.ops.map(([op, v]) => opText(op, v)).join(' · ');
    let links = '';
    if (node.links.length) {
      if (node.kind === 'If') links = `→ <a href="#script/${n}/${node.links[0]}">${node.links[0]}</a> if true, else <a href="#script/${n}/${node.links[1]}">${node.links[1]}</a>`;
      else if (node.kind === 'Case') links = '→ ' + node.links.map(l => { const t = s.nodes[l]; return `<a href="#script/${n}/${l}">${l}</a> [${t.min ?? 0}${(t.max ?? 0) === 65000 ? '+' : (t.max ?? 0) !== (t.min ?? 0) ? '–' + t.max : ''}]`; }).join(', ');
      else links = (node.kind === 'Menu' ? 'choices ' : '→ ') + node.links.map(l => `<a href="#script/${n}/${l}">${l}</a>`).join(', ');
    }
    h += `<div class="node${i === focus ? ' hl' : ''}" id="n${i}"><span class="tag">${i} ${node.kind}</span>${node.text ? `<span class="quote">${text(node.text)}</span>` : ''}${ops ? `<div class="ops">${ops}</div>` : ''}${links ? `<div class="muted">${links}</div>` : ''}</div>`;
  });
  $('side').innerHTML = h;
  if (focus !== null) document.getElementById('n' + focus)?.scrollIntoView({ block: 'center' }); else $('side').scrollTop = 0;
  graph(`s:${n}`);
}

function opText(op, v) {
  if (['SetFlag', 'ClearFlag', 'CheckFlag'].includes(op)) return `${op}(${flagLink(v)})`;
  if (['SetSpeaker', 'CameraCutToActor', 'CameraOnActor', 'AddEnemy', 'AddMember', 'RemoveMember', 'CheckMember',
       'AddItem', 'TakeItem', 'CheckItem', 'ShowItem'].includes(op)) return `${op}(${esc(name(hex4(v)))})`;
  if (op === 'RandomLine') return `${op}(<a class="script" href="#script/${v}">${v}</a>)`;
  return `${op}(${v})`;
}

function showObject(i) {
  const o = A.objects[i];
  if (!o) { $('side').innerHTML = `<p>No object ${i}.</p>`; return; }
  const refs = idx.refsBySrc.get(`o:${i}`) ?? [];
  let h = `<h2 class="object">${objectTitle(i)}</h2><div class="muted">Borg9 ${o.borg9}, object ${o.index}, at ${o.pos.join(', ')}, bits ${o.bits}</div>`;
  if (o.script) h += `<p>Starts ${scriptLink(o.script)}</p>`;
  if (o.to) h += `<p>Leads to ${esc(o.to)}</p>`;
  if (o.enemies) h += `<p>Enemies: ${o.enemies.map(e => esc(name(e))).join(', ')}</p>`;
  if (o.item || o.loot || o.gold) h += `<p>Holds ${[o.item && esc(name(o.item)), o.loot && esc(name(o.loot)), o.gold && o.gold + ' gold'].filter(Boolean).join(', ')}</p>`;
  if (o.trigger) h += `<p>Trigger: ${o.trigger} ${o.a}</p>`;
  h += `<h3>Flags</h3><ul>${refs.map(r => refItem(r, `${r.access === 'Read' ? 'reads' : r.access === 'Set' ? 'sets' : 'clears'} ${flagLink(r.flag)} <span class="muted">${esc(flagLabel(r.flag))}</span>`)).join('')}</ul>`;
  $('side').innerHTML = h; $('side').scrollTop = 0;
  graph(`o:${i}`);
}

function search(q, updateHash = true) {
  if (!q) return;
  if (updateHash) history.replaceState(null, '', '#search/' + encodeURIComponent(q));
  if (/^\d+$/.test(q)) { location.hash = `flag/${q}`; return; }
  const m = q.match(/^(?:script|borg13|b13)\s*(\d+)$/i); if (m) { location.hash = `script/${m[1]}`; return; }
  const needle = q.toLowerCase(), hits = [];
  for (const [f, l] of Object.entries(A.labels ?? {})) if (l.toLowerCase().includes(needle)) hits.push(`<li>${flagLink(+f)}: ${esc(l)}</li>`);
  A.journal.forEach((e, i) => { if (e.text.toLowerCase().includes(needle)) hits.push(`<li><a class="flag" href="#flag/${e.flag}">Journal ${i}</a>: ${esc(e.text.slice(0, 120))}</li>`); });
  for (const [n, s] of Object.entries(A.scripts)) s.nodes.forEach((node, i) => {
    if (node.text?.toLowerCase().includes(needle)) hits.push(`<li>${scriptLink(n, i)}: <span class="quote">${esc(plain(node.text).slice(0, 120))}</span></li>`);
  });
  A.objects.forEach((o, i) => { if ((o.name ?? '').toLowerCase().includes(needle) || (o.entity && name(o.entity).toLowerCase().includes(needle))) hits.push(`<li>${objectLink(i)}</li>`); });
  $('side').innerHTML = `<h2>“${esc(q)}”</h2><p class="muted">${hits.length} matches${hits.length > 400 ? ', showing 400' : ''}</p><ul>${hits.slice(0, 400).join('')}</ul>`;
}

// ---- Graph -----------------------------------------------------------------------------------

// Edges point the way things happen: setter → flag → reader, starter → script.
function upstream(key) {
  const [t, v] = [key[0], +key.slice(2)], out = [];
  if (t === 'f') {
    for (const r of idx.refsByFlag.get(v) ?? []) if (r.access !== 'Read' && !r.ignored) out.push([srcKey(r.src), key, r.role, r.access === 'Clear']);
    for (const inp of A.flags[v]?.inputs ?? []) out.push([`f:${inp}`, key, 'input']);
  } else if (t === 's') {
    for (const x of A.scripts[v].startedBy) out.push([srcKey(x.src), key, 'starts']);
    for (const r of idx.refsBySrc.get(key) ?? []) if (r.access === 'Read') out.push([`f:${r.flag}`, key, r.role]);
  } else if (t === 'o') {
    // Only prerequisites: not the object's record of its own state, such as "opened".
    for (const r of idx.refsBySrc.get(key) ?? []) if (r.access === 'Read' && gates.has(r.role)) out.push([`f:${r.flag}`, key, r.role]);
  }
  return out;
}
const gates = new Set(['ObjectVisible', 'ObjectEnabled', 'DoorLocked', 'TrapArmed']);
function downstream(key) {
  const [t, v] = [key[0], +key.slice(2)], out = [];
  if (t === 'f') {
    for (const r of idx.refsByFlag.get(v) ?? []) if (r.access === 'Read') out.push([key, srcKey(r.src), r.role]);
  } else if (t === 's' || t === 'o' || t === 'p') {
    for (const r of idx.refsBySrc.get(key) ?? []) if (r.access !== 'Read' && !r.ignored) out.push([key, `f:${r.flag}`, r.role, r.access === 'Clear']);
    if (t === 'o' && A.objects[v].script) out.push([key, `s:${A.objects[v].script}`, 'starts']);
  }
  return out;
}

function graph(start) {
  const dir = $('dir').value, depth = +$('depth').value, hideEngine = $('hideEngine').checked, limit = 160;
  const nodes = new Set([start]), edges = new Map();
  let frontier = [[start, 'up'], [start, 'down']].filter(([, d]) => dir === 'both' || d === dir);
  for (let i = 0; i < depth && nodes.size < limit; i++) {
    const next = [];
    for (const [k, d] of frontier) for (const e of (d === 'up' ? upstream(k) : downstream(k))) {
      const other = d === 'up' ? e[0] : e[1];
      if (other.startsWith('e:') || (hideEngine && other.startsWith('f:') && idx.engineFlags.has(+other.slice(2)))) continue;
      if (!nodes.has(other)) { if (nodes.size >= limit) continue; nodes.add(other); next.push([other, d]); }
      edges.set(`${e[0]}>${e[1]}`, e);
    }
    frontier = next;
  }
  const els = [...nodes].map(k => ({ data: { id: k, ...look(k) }, classes: k === start ? 'focus' : '' }))
    .concat([...edges.values()].filter(([a, b]) => nodes.has(a) && nodes.has(b))
      .map(([a, b, label, clear]) => ({ data: { id: `${a}>${b}`, source: a, target: b, label }, classes: clear ? 'clear' : '' })));
  cy.elements().remove(); cy.add(els);
  cy.resize();
  const fit = { fit: true, padding: 30 };
  cy.layout(hasDagre ? { name: 'dagre', rankDir: 'LR', nodeSep: 40, rankSep: 140, ...fit } : { name: 'breadthfirst', directed: true, ...fit }).run();
  $('info').textContent = `${A.version}: ${nodes.size} nodes${nodes.size >= limit ? ' (limit reached)' : ''}`;
}

function look(k) {
  const v = +k.slice(2);
  if (k[0] === 'f') { const l = flagLabel(v); return { label: `${v}${l && l !== 'derived' ? '\n' + l : ''}`, color: v >= A.bitFlagCount ? '#c58af0' : '#e0b04a' }; }
  if (k[0] === 's') { const s = A.scripts[v]; const t = plain(s.nodes.find(x => x.text)?.text); return { label: `B13 ${v} ${s.mode}\n${t.slice(0, 40)}`, color: '#6fa8ff', shape: 'round-rectangle' }; }
  if (k[0] === 'p') { const s = idx.refsBySrc.get(k)[0].src; return { label: `Shop ${v}\n${name(s.shopkeeper)}`, color: '#7ccf8a', shape: 'round-rectangle' }; }
  if (k[0] === 'o') { const o = A.objects[v]; return { label: `${o.type}${o.name ? ' ' + o.name : o.entity ? ' ' + name(o.entity) : ''}\n${o.chunks[0] ?? 'Borg9 ' + o.borg9}`, color: '#7ccf8a', shape: 'diamond' }; }
  return { label: k, color: '#9a9cab' };
}

const hasDagre = typeof cytoscapeDagre !== 'undefined';
if (hasDagre) cytoscape.use(cytoscapeDagre);
init();
</script>
</body>
</html>
